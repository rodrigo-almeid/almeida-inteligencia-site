<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal — Almeida Inteligência</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #3DDB82; --black: #0A0F0A; --black-green: #1A241C;
      --gray: #5C6B5E; --gray-light: #A8B8AA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--black); color: #fff; min-height: 100vh; }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 48px; height: 64px;
      background: rgba(10,15,10,0.9); backdrop-filter: blur(12px);
      border-bottom: 0.5px solid rgba(61,219,130,0.1);
    }
    .topbar-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .topbar-logo .name { font-size: 15px; font-weight: 600; color: #fff; }
    .topbar-logo .name span { color: var(--green); }
    .topbar-logo .tag { font-size: 9px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 20px; }
    .topbar-user .name { font-size: 14px; font-weight: 500; text-align: right; }
    .topbar-user .role { font-size: 11px; color: var(--green); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px; text-align: right; }
    .btn-logout {
      background: transparent; border: 0.5px solid rgba(255,255,255,0.12);
      color: var(--gray); font-size: 13px; font-family: 'Inter', sans-serif;
      padding: 7px 16px; border-radius: 6px; cursor: pointer; transition: all .2s;
    }
    .btn-logout:hover { border-color: #E24B4A; color: #E24B4A; }

    .content { padding: 100px 48px 60px; max-width: 1100px; margin: 0 auto; }

    .greeting { margin-bottom: 48px; }
    .greeting-time { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px; }
    .greeting-name { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; }
    .greeting-name span { color: var(--green); }
    .greeting-sub { font-size: 15px; color: var(--gray); margin-top: 8px; }

    .modules-label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px; }

    .modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

    .module-card {
      background: var(--black-green); border: 0.5px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 28px; cursor: pointer;
      text-decoration: none; color: inherit; display: flex; flex-direction: column;
      transition: border-color .25s, transform .2s; position: relative; overflow: hidden;
    }
    .module-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at top left, rgba(61,219,130,0.06), transparent 60%);
      opacity: 0; transition: opacity .3s;
    }
    .module-card:hover { border-color: rgba(61,219,130,0.35); transform: translateY(-3px); }
    .module-card:hover::before { opacity: 1; }
    .module-card.admin-card { border-color: rgba(61,219,130,0.15); }

    .module-icon {
      width: 52px; height: 52px; border-radius: 12px;
      background: rgba(61,219,130,0.08); border: 0.5px solid rgba(61,219,130,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 20px;
    }
    .module-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .module-desc { font-size: 13px; color: var(--gray); line-height: 1.6; flex: 1; }
    .module-arrow {
      margin-top: 20px; padding-top: 16px; border-top: 0.5px solid rgba(255,255,255,0.06);
      font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 6px;
    }
    .module-arrow::after { content: '→'; transition: transform .2s; }
    .module-card:hover .module-arrow::after { transform: translateX(4px); }

    .no-access { text-align: center; padding: 80px 20px; color: var(--gray); }
    .no-access .icon { font-size: 48px; margin-bottom: 16px; }
    .no-access h3 { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .no-access p { font-size: 14px; line-height: 1.6; }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--black-green) 25%, #243024 50%, var(--black-green) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
      border-radius: 16px; height: 200px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    @media (max-width: 768px) {
      .topbar { padding: 0 20px; }
      .content { padding: 88px 20px 40px; }
      .modules-grid { grid-template-columns: 1fr; }
      .greeting-name { font-size: 26px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/" class="topbar-logo">
    <svg viewBox="0 0 56 56" width="28" height="28">
      <polygon points="28,4 50,16 50,40 28,52 6,40 6,16" fill="none" stroke="#3DDB82" stroke-width="1.5"/>
      <circle cx="28" cy="20" r="3" fill="#3DDB82"/>
      <circle cx="18" cy="30" r="2.5" fill="#3DDB82" opacity="0.7"/>
      <circle cx="38" cy="30" r="2.5" fill="#3DDB82" opacity="0.7"/>
      <line x1="28" y1="23" x2="18" y2="28" stroke="#3DDB82" stroke-width="0.8" opacity="0.6"/>
      <line x1="28" y1="23" x2="38" y2="28" stroke="#3DDB82" stroke-width="0.8" opacity="0.6"/>
    </svg>
    <div>
      <div class="name">Almeida <span>Inteligência</span></div>
      <div class="tag">Portal de Sistemas</div>
    </div>
  </a>
  <div class="topbar-right">
    <div class="topbar-user">
      <div class="name" id="topNome">—</div>
      <div class="role" id="topPerfil">—</div>
    </div>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</div>

<div class="content">
  <div class="greeting">
    <div class="greeting-time" id="greetingTime"></div>
    <div class="greeting-name">Olá, <span id="greetingNome">—</span></div>
    <div class="greeting-sub" id="greetingSub">Carregando seus módulos...</div>
  </div>
  <div class="modules-label">Seus módulos</div>
  <div class="modules-grid" id="modulesGrid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<script>
  function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Bom dia';
    if (h < 18) return 'Boa tarde';
    return 'Boa noite';
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }

  async function init() {
    const token = localStorage.getItem('admin_token');
    const nome  = localStorage.getItem('admin_nome');
    if (!token) { window.location.href = '/'; return; }

    let payload;
    try { payload = JSON.parse(atob(token.split('.')[1])); }
    catch(e) { logout(); return; }

    if (payload.exp && Date.now() / 1000 > payload.exp) { logout(); return; }

    const perfil   = payload.perfil || '';
    const isAdmin  = perfil === 'admin';
    const primeiroNome = (nome || '').split(' ')[0] || 'usuário';

    document.getElementById('topNome').textContent    = nome || payload.email;
    document.getElementById('topPerfil').textContent  = isAdmin ? 'Administrador' : perfil;
    document.getElementById('greetingTime').textContent = getGreeting() + ',';
    document.getElementById('greetingNome').textContent  = primeiroNome;

    // Admin vai buscar lista de sistemas da API; outros usam o token
    let sistemas = [];

    if (isAdmin) {
      try {
        const res = await fetch('/api/sistemas', { headers: { 'Authorization': `Bearer ${token}` } });
        sistemas = res.ok ? await res.json() : [];
      } catch(e) { sistemas = []; }
    } else {
      sistemas = payload.sistemas || [];
    }

    // ── Redirect automático se só 1 sistema ──
    if (!isAdmin && sistemas.length === 1 && sistemas[0].url && sistemas[0].url !== '#') {
      window.location.href = sistemas[0].url;
      return;
    }

    document.getElementById('greetingSub').textContent = 'Selecione um módulo para começar.';
    renderGrid(sistemas, isAdmin);
  }

  function renderGrid(sistemas, isAdmin) {
    const grid = document.getElementById('modulesGrid');

    const sistemasAtivos = sistemas.filter(s => s.ativo !== false);

    if (!sistemasAtivos.length && !isAdmin) {
      grid.innerHTML = `
        <div class="no-access" style="grid-column:1/-1;">
          <div class="icon">🔒</div>
          <h3>Nenhum módulo disponível</h3>
          <p>Seu perfil ainda não tem acesso a nenhum módulo.<br>Entre em contato com o administrador.</p>
        </div>`;
      return;
    }

    const cards = sistemasAtivos.map(s => `
      <a class="module-card" href="${s.url || '#'}" onclick="acessarModulo(event, '${s.url || '#'}')">
        <div class="module-icon">${s.icone || '🖥️'}</div>
        <div class="module-title">${s.nome}</div>
        <div class="module-desc">${s.descricao || ''}</div>
        <div class="module-arrow">Acessar módulo</div>
      </a>
    `).join('');

    const adminCard = isAdmin ? `
      <a class="module-card admin-card" href="/admin/">
        <div class="module-icon">⚙️</div>
        <div class="module-title">Painel Administrativo</div>
        <div class="module-desc">Gerencie usuários, perfis, sistemas e permissões de acesso.</div>
        <div class="module-arrow">Acessar painel</div>
      </a>` : '';

    grid.innerHTML = cards + adminCard;
  }

  async function acessarModulo(event, url) {
    if (!url || url === '#') return;
    event.preventDefault();

    const token = localStorage.getItem('admin_token');

    // Módulos centrais (credenciais / financeiro)
    if (url.includes('/credenciais') || url.includes('/financeiro')) {
      try {
        const res = await fetch('/central/auth/sso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ portal_token: token })
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('central_token', data.access_token);
          localStorage.setItem('central_email', data.email);
        }
      } catch(e) {}
      window.location.href = url;
      return;
    }

    // Módulo de e-mails
    if (url.includes('/email')) {
      try {
        const res = await fetch('/email/auth/sso', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ portal_token: token })
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('email_token', data.access_token);
          localStorage.setItem('email_nome', data.nome);
          localStorage.setItem('email_email', data.email);
        }
      } catch(e) {}
      window.location.href = url;
      return;
    }

    window.location.href = url;
  }

  init();
</script>
<script src="/auth-guard.js"></script>
</body>
</html>
