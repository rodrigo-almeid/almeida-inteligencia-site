services:

  db:
    image: postgres:15-alpine
    container_name: almeida-db
    environment:
      POSTGRES_DB: almeida
      POSTGRES_USER: almeida
      POSTGRES_PASSWORD: almeida123
    volumes:
      - almeida_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: almeida-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: almeida
      DB_USER: almeida
      DB_PASS: almeida123
      SECRET_KEY: "almeida-super-secret-2025"
    depends_on:
      - db
    restart: unless-stopped

  email-db:
    image: postgres:15-alpine
    container_name: email-db
    environment:
      POSTGRES_DB: email_manager
      POSTGRES_USER: email_user
      POSTGRES_PASSWORD: email_pass_2025
    volumes:
      - email_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  email-backend:
    build: ./email_classifier
    container_name: email-backend
    environment:
      DATABASE_URL: "postgresql://email_user:email_pass_2025@email-db:5432/email_manager"
      FERNET_SECRET_KEY: "_Vst7BJB0-lkH4_WBLn2K7OzOwBOS-pG49AYLlAKyuY="
      JWT_SECRET_KEY: "f970d76284788d78273ab4bbe58e627190232299468af188c788eb973546148e"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "480"
    depends_on:
      email-db:
        condition: service_healthy
    volumes:
      - email_models:/app/models
    restart: unless-stopped

  central-db:
    image: postgres:15-alpine
    container_name: central-db
    environment:
      POSTGRES_DB: central_db
      POSTGRES_USER: central_user
      POSTGRES_PASSWORD: central_pass_2025
    volumes:
      - central_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  central-backend:
    build: ./central_backend
    container_name: central-backend
    environment:
      DATABASE_URL: "postgresql://central_user:central_pass_2025@central-db:5432/central_db"
      FERNET_SECRET_KEY: "YWxzT1RxZU9EUW1lWjhkVVlCS2tpN1htUDFwZzBVbTk="
      JWT_SECRET_KEY: "c3e8d1a04f2b9e7c6d5a4b3f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "480"
    depends_on:
      central-db:
        condition: service_healthy
    restart: unless-stopped

  site:
    build: .
    container_name: almeida-inteligencia
    ports:
      - "8080:80"
    depends_on:
      - backend
      - email-backend
      - central-backend
    restart: unless-stopped

volumes:
  almeida_pgdata:
  email_pgdata:
  email_models:
  central_pgdata:
