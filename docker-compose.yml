services:

  db:
    image: postgres:15-alpine
    container_name: almeida-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - almeida_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: almeida-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      SECRET_KEY: ${PORTAL_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  email-backend:
    build: ./email_classifier
    container_name: email-backend
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      FERNET_SECRET_KEY: ${EMAIL_FERNET_SECRET_KEY}
      JWT_SECRET_KEY: ${EMAIL_JWT_SECRET_KEY}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "30"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - email_models:/app/models
    restart: unless-stopped

  central-backend:
    build: ./central_backend
    container_name: central-backend
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      FERNET_SECRET_KEY: ${CENTRAL_FERNET_SECRET_KEY}
      JWT_SECRET_KEY: ${CENTRAL_JWT_SECRET_KEY}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "30"
      EVOLUTION_API_URL: http://evolution-api:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      SERVER_URL: https://almeidainteligencia.com.br
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: WARN
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  site:
    build: .
    container_name: almeida-inteligencia
    ports:
      - "8080:80"
    depends_on:
      - backend
      - email-backend
      - central-backend
    restart: unless-stopped

volumes:
  almeida_pgdata:
  email_models:
  evolution_instances:
  evolution_redis:
