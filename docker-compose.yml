x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:

  redis:
    image: redis:7-alpine
    container_name: almeida-redis
    restart: unless-stopped
    logging: *default-logging

  criador-worker:
    build: ./central_backend
    container_name: almeida-criador-worker
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDIA_DIR: /app/media/transcricoes
      WHISPER_DEVICE: cpu
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - transcricoes_media:/app/media/transcricoes
    restart: unless-stopped
    command: arq backend.criador.worker.WorkerSettings
    logging: *default-logging

  db:
    image: postgres:15-alpine
    container_name: almeida-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - almeida_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build: ./backend
    container_name: almeida-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      SECRET_KEY: ${PORTAL_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  email-backend:
    build: ./email_classifier
    container_name: email-backend
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      FERNET_SECRET_KEY: ${EMAIL_FERNET_SECRET_KEY}
      JWT_SECRET_KEY: ${EMAIL_JWT_SECRET_KEY}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "30"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - email_models:/app/models
    restart: unless-stopped
    logging: *default-logging

  central-backend:
    build: ./central_backend
    container_name: central-backend
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      FERNET_SECRET_KEY: ${CENTRAL_FERNET_SECRET_KEY}
      JWT_SECRET_KEY: ${CENTRAL_JWT_SECRET_KEY}
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "30"
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDIA_DIR: /app/media/transcricoes
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - transcricoes_media:/app/media/transcricoes
    restart: unless-stopped
    logging: *default-logging

  site:
    build: .
    container_name: almeida-inteligencia
    ports:
      - "8080:80"
    depends_on:
      - backend
      - email-backend
      - central-backend
    restart: unless-stopped
    logging: *default-logging

volumes:
  almeida_pgdata:
  email_models:
  transcricoes_media:
