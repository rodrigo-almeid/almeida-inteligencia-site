server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Landing page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard pós-login
    location /dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Painel admin
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # API backend (Almeida portal)
    location /api/ {
        set $upstream_backend backend:8001;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Módulos Centrais (credenciais + financeiro)
    location /central/ {
        set $upstream_central central-backend:8000;
        rewrite ^/central/(.*) /$1 break;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Assets compartilhados entre os módulos centrais (sidebar.js, sidebar.css, ...)
    location /shared/ {
        set $upstream_central central-backend:8000;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /credenciais/ {
        set $upstream_central central-backend:8000;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /financeiro/ {
        set $upstream_central central-backend:8000;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assistente Virtual (frontend)
    location /assistente-painel/ {
        set $upstream_central central-backend:8000;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assistente Virtual (webhook Evolution API + API config) — bot único, cobre agendamento e finanças
    location /assistente/ {
        set $upstream_central central-backend:8000;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Agendamento — sub-recursos (horários/serviços/clientes/appointments/Google Calendar).
    # Sem frontend próprio: a UI fica em /assistente-painel/ (aba "E-mail/Agenda" etc).
    location /agendamento/ {
        set $upstream_central central-backend:8000;
        proxy_pass http://$upstream_central;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Classificador de E-mails (frontend + API servidos pelo email-backend)
    location /email/ {
        set $upstream_email email-backend:8000;
        rewrite ^/email/(.*) /$1 break;
        proxy_pass http://$upstream_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache de estáticos (apenas arquivos locais do nginx, não proxied)
    location ~* ^/(dashboard|admin)/.*\.(css|js|svg|ico|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
