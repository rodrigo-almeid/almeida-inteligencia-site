name: Deploy na VM

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Testes Unitários (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: central_backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: central_backend/requirements-test.txt

      - name: Instalar dependências
        run: pip install -r requirements-test.txt

      - name: Rodar testes
        run: pytest --cov=backend --cov-report=term-missing

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Disparar deploy via webhook
        run: |
          curl -X POST https://deploy.almeidainteligencia.com.br/deploy \
            -H "X-Deploy-Token: almeida-deploy-2025" \
            --fail \
            --max-time 30

  integration:
    name: Testes de Integração (Newman)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Newman
        run: npm install -g newman

      - name: Rodar testes de integração (com retry)
        run: |
          MAX_TENTATIVAS=5
          ESPERA=30
          TENTATIVA=1

          while [ $TENTATIVA -le $MAX_TENTATIVAS ]; do
            echo ""
            echo "========================================="
            echo "  Tentativa $TENTATIVA de $MAX_TENTATIVAS"
            echo "========================================="
            echo ""

            newman run central_backend/tests/integration/Almeida_Inteligencia_Full_Flow.postman_collection.json \
              --timeout-request 15000 \
              --reporters cli && exit 0

            echo ""
            echo "Tentativa $TENTATIVA falhou. Aguardando ${ESPERA}s antes de tentar novamente..."
            sleep $ESPERA
            TENTATIVA=$((TENTATIVA + 1))
          done

          echo ""
          echo "Todas as $MAX_TENTATIVAS tentativas falharam."
          exit 1
