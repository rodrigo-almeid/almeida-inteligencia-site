name: Deploy na VM

on:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: central_backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: central_backend/requirements-test.txt

      - name: Instalar dependências
        run: pip install -r requirements-test.txt

      - name: Rodar testes
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Disparar deploy via webhook
        run: |
          curl -X POST https://deploy.almeidainteligencia.com.br/deploy \
            -H "X-Deploy-Token: almeida-deploy-2025" \
            --fail \
            --max-time 30
