<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro — Almeida Inteligência</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --green:#3DDB82; --black:#0A0F0A; --bg2:#1A241C; --gray:#5C6B5E; --gray-l:#A8B8AA; --red:#E24B4A; }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--black);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:var(--bg2);border:0.5px solid rgba(61,219,130,0.15);border-radius:20px;padding:40px;width:100%;max-width:380px;}
    .logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
    .logo .name{font-size:15px;font-weight:600;} .logo .name span{color:var(--green);}
    .logo .tag{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.12em;}
    h2{font-size:22px;font-weight:600;margin-bottom:6px;}
    .sub{font-size:13px;color:var(--gray);margin-bottom:28px;}
    .field{margin-bottom:16px;}
    label{font-size:11px;color:var(--gray-l);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;}
    input{width:100%;background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#fff;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
    input:focus{border-color:rgba(61,219,130,.4);}
    .btn{width:100%;background:var(--green);color:var(--black);border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:8px;transition:opacity .2s;}
    .btn:hover{opacity:.85;} .btn:disabled{opacity:.5;cursor:not-allowed;}
    .erro{font-size:13px;color:var(--red);margin-top:12px;display:none;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 56 56" width="28" height="28">
      <polygon points="28,4 50,16 50,40 28,52 6,40 6,16" fill="none" stroke="#3DDB82" stroke-width="1.5"/>
      <circle cx="28" cy="20" r="3" fill="#3DDB82"/>
      <circle cx="18" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/>
      <circle cx="38" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/>
      <line x1="28" y1="23" x2="18" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/>
      <line x1="28" y1="23" x2="38" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/>
    </svg>
    <div>
      <div class="name">Almeida <span>Inteligência</span></div>
      <div class="tag">Automação Financeira</div>
    </div>
  </div>
  <h2>Acesse sua conta</h2>
  <p class="sub">Controle financeiro com inteligência.</p>
  <div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com" autofocus></div>
  <div class="field"><label>Senha</label><input id="senha" type="password" placeholder="••••••••"></div>
  <div class="erro" id="erro"></div>
  <button class="btn" id="btn" onclick="login()">Entrar</button>
</div>
<script>
  if (localStorage.getItem('central_token')) location.href = '/financeiro/dashboard.html';
  document.addEventListener('keydown', e => { if (e.key==='Enter') login(); });
  async function login() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const erroEl = document.getElementById('erro');
    const btn = document.getElementById('btn');
    erroEl.style.display='none';
    if (!email||!senha){erroEl.textContent='Preencha e-mail e senha.';erroEl.style.display='block';return;}
    btn.disabled=true; btn.textContent='Entrando…';
    try {
      const form=new URLSearchParams(); form.append('username',email); form.append('password',senha);
      const res=await fetch('/central/auth/login',{method:'POST',body:form});
      const data=await res.json();
      if(!res.ok){erroEl.textContent=data.detail||'Credenciais inválidas.';erroEl.style.display='block';return;}
      localStorage.setItem('central_token',data.access_token);
      localStorage.setItem('central_email',data.email||email);
      location.href='/financeiro/dashboard.html';
    } catch {erroEl.textContent='Erro de conexão.';erroEl.style.display='block';}
    finally{btn.disabled=false;btn.textContent='Entrar';}
  }
</script>
</body>
</html>
