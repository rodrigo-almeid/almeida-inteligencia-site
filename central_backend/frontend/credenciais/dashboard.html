<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credenciais — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/sidebar.css">
  <style>
    :root { --green:#3DDB82; --black:#0A0F0A; --bg2:#1A241C; --bg3:#0E1810; --gray:#5C6B5E; --gray-l:#A8B8AA; --red:#E24B4A; --border:rgba(61,219,130,0.12); }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--black);color:#fff;min-height:100vh;display:flex;}

    /* Main */
    .main{flex:1;padding:32px;overflow-y:auto;}
    .page-header{margin-bottom:28px;}
    .page-header h1{font-size:22px;font-weight:600;}
    .page-header p{font-size:13px;color:var(--gray);margin-top:4px;}

    /* Perfis row */
    .perfis-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
    .perfil-tab{padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--gray-l);transition:all .2s;font-family:'Inter',sans-serif;}
    .perfil-tab.active{background:var(--green);color:var(--black);border-color:var(--green);font-weight:600;}
    .perfil-tab:hover:not(.active){border-color:rgba(61,219,130,0.3);color:#fff;}
    .add-perfil-btn{padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:0.5px dashed rgba(61,219,130,0.3);background:transparent;color:var(--green);transition:all .2s;font-family:'Inter',sans-serif;}
    .add-perfil-btn:hover{border-color:var(--green);}

    /* Cards */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .section-title{font-size:15px;font-weight:600;}
    .btn-add{background:var(--green);color:var(--black);border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;}
    .btn-add:hover{opacity:.85;}

    .cred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
    .cred-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s;}
    .cred-card:hover{border-color:rgba(61,219,130,0.25);}
    .cred-sistema{font-size:14px;font-weight:600;margin-bottom:4px;}
    .cred-usuario{font-size:12px;color:var(--gray-l);margin-bottom:10px;}
    .cred-senha-row{display:flex;align-items:center;gap:8px;}
    .cred-senha{font-size:13px;font-family:monospace;background:rgba(255,255,255,0.04);border-radius:6px;padding:5px 10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .icon-btn{background:none;border:0.5px solid var(--border);border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--gray-l);transition:all .2s;font-size:12px;}
    .icon-btn:hover{border-color:rgba(61,219,130,0.3);color:#fff;}
    .icon-btn.del:hover{border-color:rgba(226,75,74,0.4);color:var(--red);}

    .empty{text-align:center;padding:48px 0;color:var(--gray);font-size:13px;}
    .empty .icon{font-size:32px;margin-bottom:12px;opacity:.4;}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;display:none;}
    .modal-backdrop.show{display:flex;}
    .modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:400px;}
    .modal h3{font-size:17px;font-weight:600;margin-bottom:20px;}
    .field{margin-bottom:14px;}
    .field label{font-size:11px;color:var(--gray-l);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;}
    .field input,.field select{width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;font-size:14px;color:#fff;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
    .field input:focus,.field select:focus{border-color:rgba(61,219,130,0.4);}
    .field select option{background:var(--bg2);}
    .modal-actions{display:flex;gap:8px;margin-top:20px;}
    .btn-cancel{flex:1;background:none;border:0.5px solid var(--border);border-radius:10px;padding:11px;color:var(--gray-l);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;}
    .btn-cancel:hover{border-color:rgba(255,255,255,.2);color:#fff;}
    .btn-save{flex:2;background:var(--green);color:var(--black);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;}
    .btn-save:hover{opacity:.85;}

    .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all .3s;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.ok{border-color:rgba(61,219,130,0.4);color:var(--green);}
    .toast.err{border-color:rgba(226,75,74,0.4);color:var(--red);}

    @media(max-width:640px){.main{padding:60px 20px 20px 20px;}}
  </style>
</head>
<body>
<script>
  window.SIDEBAR_CONFIG = {
    tag: 'Credenciais',
    ativo: 'credenciais',
    items: [
      { id: 'credenciais', href: '/credenciais/dashboard.html', icon: 'credenciais', label: 'Credenciais' },
    ],
    breadcrumb: [
      { label: 'Portal', href: 'https://almeidainteligencia.com.br/dashboard/' },
      { label: 'Credenciais' },
    ],
  };
</script>
<script src="/shared/sidebar.js"></script>

<div id="sidebar-root"></div>

<div class="main">
  <div id="breadcrumb-root"></div>
  <div class="page-header">
    <h1>Gerenciador de Credenciais</h1>
    <p>Senhas corporativas criptografadas com Fernet</p>
  </div>

  <div class="perfis-row" id="perfis-row">
    <button class="add-perfil-btn" onclick="abrirModalPerfil()">+ Novo Perfil</button>
  </div>

  <div class="section-header">
    <span class="section-title" id="section-title">Selecione um perfil</span>
    <button class="btn-add" id="btn-add-cred" onclick="abrirModalCred()" style="display:none">+ Credencial</button>
  </div>

  <div class="cred-grid" id="cred-grid">
    <div class="empty"><div class="icon">🔒</div>Selecione um perfil para ver as credenciais.</div>
  </div>
</div>

<!-- Modal: Nova Credencial -->
<div class="modal-backdrop" id="modal-cred">
  <div class="modal">
    <h3>Nova Credencial</h3>
    <div class="field"><label>Sistema / Site</label><input id="c-sistema" placeholder="ex: Gmail, AWS, Banco..."></div>
    <div class="field"><label>Usuário / E-mail</label><input id="c-usuario" placeholder="usuario@exemplo.com"></div>
    <div class="field"><label>Senha</label><input id="c-senha" type="password" placeholder="••••••••"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal('modal-cred')">Cancelar</button>
      <button class="btn-save" onclick="salvarCred()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Novo Perfil -->
<div class="modal-backdrop" id="modal-perfil">
  <div class="modal">
    <h3>Novo Perfil</h3>
    <div class="field"><label>Nome do Perfil</label><input id="p-nome" placeholder="ex: Pessoal, Empresa, Projetos..."></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal('modal-perfil')">Cancelar</button>
      <button class="btn-save" onclick="salvarPerfil()">Criar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/central';
let token = localStorage.getItem('central_token');
let perfilAtivo = null;

if (!token) location.href = '/credenciais/';

function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${tipo} show`;
  setTimeout(() => el.className = 'toast', 3000);
}

function fecharModal(id) { document.getElementById(id).classList.remove('show'); }
function abrirModalCred() { document.getElementById('modal-cred').classList.add('show'); }
function abrirModalPerfil() { document.getElementById('modal-perfil').classList.add('show'); }

async function api(path, opts={}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers||{}) }
  });
  if (res.status === 401) { logout(); return null; }
  return res;
}

async function carregarPerfis() {
  const res = await api('/pessoas/');
  if (!res) return;
  const perfis = await res.json();
  const row = document.getElementById('perfis-row');
  row.innerHTML = '<button class="add-perfil-btn" onclick="abrirModalPerfil()">+ Novo Perfil</button>';
  perfis.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'perfil-tab' + (p.id === perfilAtivo?.id ? ' active' : '');
    btn.textContent = p.nome;
    btn.onclick = () => selecionarPerfil(p);
    row.prepend(btn);
  });
  if (perfis.length && !perfilAtivo) selecionarPerfil(perfis[0]);
}

async function selecionarPerfil(p) {
  perfilAtivo = p;
  document.querySelectorAll('.perfil-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.perfil-tab').forEach(b => { if(b.textContent === p.nome) b.classList.add('active'); });
  document.getElementById('section-title').textContent = p.nome;
  document.getElementById('btn-add-cred').style.display = 'block';
  await carregarCredenciais(p.id);
}

async function carregarCredenciais(pessoaId) {
  const res = await api(`/me/senhas/${pessoaId}`);
  if (!res) return;
  const creds = await res.json();
  const grid = document.getElementById('cred-grid');
  if (!creds.length) {
    grid.innerHTML = '<div class="empty"><div class="icon">🔑</div>Nenhuma credencial ainda. Clique em "+ Credencial".</div>';
    return;
  }
  grid.innerHTML = creds.map(c => `
    <div class="cred-card">
      <div class="cred-sistema">${esc(c.sistema)}</div>
      <div class="cred-usuario">${esc(c.usuario_sistema)}</div>
      <div class="cred-senha-row">
        <div class="cred-senha" id="pwd-${c.id}">••••••••</div>
        <button class="icon-btn" onclick="toggleSenha(${c.id}, '${btoa(c.senha_criptografada)}')" title="Mostrar/ocultar">👁</button>
        <button class="icon-btn" onclick="copiarSenha('${btoa(c.senha_criptografada)}')" title="Copiar">📋</button>
        <button class="icon-btn del" onclick="deletarCred(${c.id})" title="Excluir">🗑</button>
      </div>
    </div>`).join('');
}

function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toggleSenha(id, b64) {
  const el = document.getElementById('pwd-'+id);
  el.textContent = el.textContent === '••••••••' ? atob(b64) : '••••••••';
}

function copiarSenha(b64) {
  navigator.clipboard.writeText(atob(b64)).then(() => toast('Copiado!'));
}

async function salvarCred() {
  const sistema = document.getElementById('c-sistema').value.trim();
  const usuario = document.getElementById('c-usuario').value.trim();
  const senha = document.getElementById('c-senha').value;
  if (!sistema || !usuario || !senha) { toast('Preencha todos os campos.','err'); return; }
  const res = await api('/me/senhas/', {
    method: 'POST',
    body: JSON.stringify({ sistema, usuario_sistema: usuario, senha, pessoa_id: perfilAtivo.id })
  });
  if (res?.ok) {
    fecharModal('modal-cred');
    document.getElementById('c-sistema').value = '';
    document.getElementById('c-usuario').value = '';
    document.getElementById('c-senha').value = '';
    toast('Credencial salva!');
    await carregarCredenciais(perfilAtivo.id);
  } else { toast('Erro ao salvar.','err'); }
}

async function deletarCred(id) {
  if (!confirm('Excluir esta credencial?')) return;
  const res = await api(`/me/senhas/credencial/${id}`, { method: 'DELETE' });
  if (res?.ok) { toast('Removida.'); await carregarCredenciais(perfilAtivo.id); }
  else toast('Erro.','err');
}

async function salvarPerfil() {
  const nome = document.getElementById('p-nome').value.trim();
  if (!nome) { toast('Digite um nome.','err'); return; }
  const res = await api('/pessoas/', { method: 'POST', body: JSON.stringify({ nome, principal: false }) });
  if (res?.ok) {
    fecharModal('modal-perfil');
    document.getElementById('p-nome').value = '';
    toast('Perfil criado!');
    await carregarPerfis();
  } else { toast('Erro ao criar perfil.','err'); }
}

function logout() {
  localStorage.removeItem('central_token');
  localStorage.removeItem('central_email');
  sessionStorage.setItem('logout_reason', 'manual');
  location.href = '/credenciais/';
}


carregarPerfis();
</script>
</body>
</html>
