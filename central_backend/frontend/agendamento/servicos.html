<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento — Servicos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#3DDB82;--black:#0A0F0A;--bg2:#1A241C;--bg3:#0E1810;--gray:#5C6B5E;--gray-l:#A8B8AA;--red:#E24B4A;--yellow:#F5A623;--border:rgba(61,219,130,0.12);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--black);color:#fff;min-height:100vh;display:flex;}
    .sidebar{width:220px;height:100vh;position:sticky;top:0;background:var(--bg3);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;overflow-y:auto;}
    .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
    .sidebar .logo .name{font-size:13px;font-weight:600;} .sidebar .logo .name span{color:var(--green);}
    .sidebar .tag{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.1em;margin-top:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:var(--gray-l);cursor:pointer;transition:all .2s;margin-bottom:4px;text-decoration:none;}
    .nav-item:hover,.nav-item.active{background:rgba(61,219,130,.08);color:var(--green);}
    .sidebar-spacer{flex:1;}
    .user-chip{background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--gray-l);}
    .user-chip .email{font-size:11px;color:var(--gray);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .logout-btn{margin-top:8px;width:100%;background:none;border:0.5px solid rgba(226,75,74,.3);border-radius:10px;padding:9px;color:var(--red);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;}
    .logout-btn:hover{background:rgba(226,75,74,.08);}
    .main{flex:1;padding:32px;overflow-y:auto;}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
    .page-header h1{font-size:22px;font-weight:600;}
    .page-header p{font-size:13px;color:var(--gray);margin-top:4px;}
    .btn-add{background:var(--green);color:var(--black);border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;}
    .btn-add:hover{opacity:.85;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;text-align:left;border-bottom:0.5px solid var(--border);}
    td{padding:12px 12px;font-size:13px;border-bottom:0.5px solid rgba(255,255,255,.04);vertical-align:middle;}
    tr:hover td{background:rgba(255,255,255,.02);}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
    .badge.on{background:rgba(61,219,130,.15);color:var(--green);}
    .badge.off{background:rgba(92,107,94,.15);color:var(--gray);}
    .icon-btn{background:none;border:0.5px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--gray-l);transition:all .2s;font-size:12px;}
    .icon-btn:hover{border-color:rgba(61,219,130,.3);color:#fff;}
    .icon-btn.del:hover{border-color:rgba(226,75,74,.4);color:var(--red);}
    .empty{text-align:center;padding:48px 0;color:var(--gray);font-size:13px;}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;}
    .modal-backdrop.show{display:flex;}
    .modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
    .modal h3{font-size:17px;font-weight:600;margin-bottom:20px;}
    .field{margin-bottom:14px;}
    .field label{font-size:11px;color:var(--gray-l);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:6px;}
    .field input,.field textarea{width:100%;background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;font-size:14px;color:#fff;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;resize:vertical;}
    .field input:focus,.field textarea:focus{border-color:rgba(61,219,130,.4);}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .modal-actions{display:flex;gap:8px;margin-top:20px;}
    .btn-cancel{flex:1;background:none;border:0.5px solid var(--border);border-radius:10px;padding:11px;color:var(--gray-l);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;}
    .btn-cancel:hover{border-color:rgba(255,255,255,.2);color:#fff;}
    .btn-save{flex:2;background:var(--green);color:var(--black);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;}
    .btn-save:hover{opacity:.85;}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all .3s;}
    .toast.show{opacity:1;transform:translateY(0);}.toast.ok{border-color:rgba(61,219,130,.4);color:var(--green);}.toast.err{border-color:rgba(226,75,74,.4);color:var(--red);}
    @media(max-width:640px){.sidebar{display:none;}.main{padding:16px;}.row2{grid-template-columns:1fr;}}
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><svg viewBox="0 0 56 56" width="26" height="26"><polygon points="28,4 50,16 50,40 28,52 6,40 6,16" fill="none" stroke="#3DDB82" stroke-width="1.5"/><circle cx="28" cy="20" r="3" fill="#3DDB82"/><circle cx="18" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/><circle cx="38" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/><line x1="28" y1="23" x2="18" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/><line x1="28" y1="23" x2="38" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/></svg><div><div class="name">Almeida <span>Inteligencia</span></div><div class="tag">Agendamento</div></div></div>
  <a href="/agendamento-painel/" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Dashboard</a>
  <a href="/agendamento-painel/config.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9"/></svg>Configuracoes</a>
  <a href="/agendamento-painel/servicos.html" class="nav-item active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Servicos</a>
  <a href="/agendamento-painel/horarios.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Horarios</a>
  <a href="/agendamento-painel/clientes.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clientes</a>
  <a href="/dashboard/" class="nav-item" id="portal-link" style="display:none"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Portal</a>
  <div class="sidebar-spacer"></div>
  <div class="user-chip"><div>Conta</div><div class="email" id="user-email">—</div></div>
  <button class="logout-btn" onclick="logout()">Sair</button>
</div>

<div class="main">
  <div class="page-header">
    <div><h1>Servicos</h1><p>Cadastre os servicos oferecidos pelo estabelecimento</p></div>
    <button class="btn-add" onclick="abrirModal()">+ Novo Servico</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Nome</th><th>Descricao</th><th>Duracao</th><th>Preco</th><th>Status</th><th>Acoes</th></tr></thead>
      <tbody id="tabela-body"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">Nenhum servico cadastrado.</div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">Novo Servico</h3>
    <input type="hidden" id="edit-id">
    <div class="field"><label>Nome</label><input id="f-nome" placeholder="Ex: Corte masculino"></div>
    <div class="field"><label>Descricao</label><textarea id="f-desc" rows="2" placeholder="Descricao opcional"></textarea></div>
    <div class="row2">
      <div class="field"><label>Duracao (minutos)</label><input type="number" id="f-duracao" placeholder="30" min="5"></div>
      <div class="field"><label>Preco (R$)</label><input type="number" id="f-preco" placeholder="50.00" step="0.01" min="0"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/central/agendamento';
const TOKEN = localStorage.getItem('central_token');
const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
let servicos = [];

document.getElementById('user-email').textContent = localStorage.getItem('central_email') || '—';
if (localStorage.getItem('admin_token')) document.getElementById('portal-link').style.display = '';

async function carregar() {
  try {
    const res = await fetch(`${API}/servicos`, { headers: HEADERS });
    if (res.ok) { servicos = await res.json(); render(); }
  } catch(e) { console.error(e); }
}

function render() {
  const body = document.getElementById('tabela-body');
  const empty = document.getElementById('empty-msg');
  if (!servicos.length) { body.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  body.innerHTML = servicos.map(s => `<tr>
    <td style="font-weight:500">${s.nome}</td>
    <td style="color:var(--gray-l)">${s.descricao || '—'}</td>
    <td>${s.duracao_minutos} min</td>
    <td>${s.preco != null ? 'R$ '+s.preco.toFixed(2) : '—'}</td>
    <td><span class="badge ${s.ativo?'on':'off'}">${s.ativo?'Ativo':'Inativo'}</span></td>
    <td>
      <button class="icon-btn" onclick="editar(${s.id})" title="Editar">✎</button>
      <button class="icon-btn del" onclick="deletar(${s.id})" title="Excluir">✕</button>
    </td>
  </tr>`).join('');
}

function abrirModal(s) {
  document.getElementById('modal-title').textContent = s ? 'Editar Servico' : 'Novo Servico';
  document.getElementById('edit-id').value = s ? s.id : '';
  document.getElementById('f-nome').value = s ? s.nome : '';
  document.getElementById('f-desc').value = s ? (s.descricao || '') : '';
  document.getElementById('f-duracao').value = s ? s.duracao_minutos : '';
  document.getElementById('f-preco').value = s ? (s.preco || '') : '';
  document.getElementById('modal').classList.add('show');
}

function fecharModal() { document.getElementById('modal').classList.remove('show'); }

function editar(id) {
  const s = servicos.find(x => x.id === id);
  if (s) abrirModal(s);
}

async function salvar() {
  const id = document.getElementById('edit-id').value;
  const body = {
    nome: document.getElementById('f-nome').value,
    descricao: document.getElementById('f-desc').value || null,
    duracao_minutos: parseInt(document.getElementById('f-duracao').value) || 30,
    preco: parseFloat(document.getElementById('f-preco').value) || null,
    ativo: true,
  };

  try {
    const url = id ? `${API}/servicos/${id}` : `${API}/servicos`;
    const res = await fetch(url, { method: id ? 'PUT' : 'POST', headers: HEADERS, body: JSON.stringify(body) });
    if (res.ok) { toast('Servico salvo!', 'ok'); fecharModal(); carregar(); }
    else { const e = await res.json(); toast(e.detail || 'Erro', 'err'); }
  } catch(e) { toast('Erro de conexao', 'err'); }
}

async function deletar(id) {
  if (!confirm('Excluir este servico?')) return;
  try {
    const res = await fetch(`${API}/servicos/${id}`, { method: 'DELETE', headers: HEADERS });
    if (res.ok) { toast('Servico excluido', 'ok'); carregar(); }
    else toast('Erro ao excluir', 'err');
  } catch(e) { toast('Erro de conexao', 'err'); }
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${tipo}`;
  setTimeout(() => t.className = 'toast', 3000);
}

function logout() { localStorage.removeItem('central_token'); localStorage.removeItem('central_email'); window.location.href = '/dashboard/'; }

carregar();
</script>
</body>
</html>
