<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento — Clientes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#3DDB82;--black:#0A0F0A;--bg2:#1A241C;--bg3:#0E1810;--gray:#5C6B5E;--gray-l:#A8B8AA;--red:#E24B4A;--yellow:#F5A623;--blue:#7EB8FF;--border:rgba(61,219,130,0.12);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--black);color:#fff;min-height:100vh;display:flex;}
    .sidebar{width:220px;height:100vh;position:sticky;top:0;background:var(--bg3);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;overflow-y:auto;}
    .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
    .sidebar .logo .name{font-size:13px;font-weight:600;} .sidebar .logo .name span{color:var(--green);}
    .sidebar .tag{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.1em;margin-top:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:var(--gray-l);cursor:pointer;transition:all .2s;margin-bottom:4px;text-decoration:none;}
    .nav-item:hover,.nav-item.active{background:rgba(61,219,130,.08);color:var(--green);}
    .sidebar-spacer{flex:1;}
    .user-chip{background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--gray-l);}
    .user-chip .email{font-size:11px;color:var(--gray);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .logout-btn{margin-top:8px;width:100%;background:none;border:0.5px solid rgba(226,75,74,.3);border-radius:10px;padding:9px;color:var(--red);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;}
    .logout-btn:hover{background:rgba(226,75,74,.08);}
    .main{flex:1;padding:32px;overflow-y:auto;}
    .page-header{margin-bottom:28px;}
    .page-header h1{font-size:22px;font-weight:600;}
    .page-header p{font-size:13px;color:var(--gray);margin-top:4px;}
    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;text-align:left;border-bottom:0.5px solid var(--border);}
    td{padding:12px 12px;font-size:13px;border-bottom:0.5px solid rgba(255,255,255,.04);vertical-align:middle;}
    tr:hover td{background:rgba(255,255,255,.02);}
    tr.clickable{cursor:pointer;}
    .empty{text-align:center;padding:48px 0;color:var(--gray);font-size:13px;}

    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;}
    .modal-backdrop.show{display:flex;}
    .modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
    .modal h3{font-size:17px;font-weight:600;margin-bottom:6px;}
    .modal .sub{font-size:12px;color:var(--gray);margin-bottom:20px;}
    .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,.04);font-size:13px;}
    .detail-row .label{color:var(--gray-l);} .detail-row .value{font-weight:500;}
    .hist-title{font-size:13px;font-weight:600;margin-top:20px;margin-bottom:10px;}
    .hist-item{padding:8px 0;border-bottom:0.5px solid rgba(255,255,255,.04);font-size:12px;color:var(--gray-l);}
    .hist-item .dt{color:#fff;font-weight:500;}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;margin-left:6px;}
    .badge.confirmado{background:rgba(61,219,130,.15);color:var(--green);}
    .badge.pre_reservado{background:rgba(245,166,35,.15);color:var(--yellow);}
    .badge.cancelado{background:rgba(226,75,74,.15);color:var(--red);}
    .badge.concluido{background:rgba(126,184,255,.15);color:var(--blue);}
    .badge.expirado{background:rgba(92,107,94,.15);color:var(--gray);}
    .btn-close{background:none;border:0.5px solid var(--border);border-radius:10px;padding:10px;width:100%;color:var(--gray-l);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;margin-top:16px;transition:all .2s;}
    .btn-close:hover{border-color:rgba(255,255,255,.2);color:#fff;}

    @media(max-width:640px){.sidebar{display:none;}.main{padding:60px 16px 16px 16px;}.mobile-hamburger{display:block;}}
    .mobile-hamburger{display:none;position:fixed;top:14px;left:14px;z-index:1001;background:var(--bg2,#1A241C);border:0.5px solid var(--border,rgba(61,219,130,0.12));border-radius:10px;padding:10px;cursor:pointer;color:#fff;}
    .mobile-hamburger svg{display:block;}
    .sidebar-overlay{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);}
    .sidebar-overlay.active{display:block;}
    .sidebar.mobile-open{display:flex!important;position:fixed;z-index:1000;height:100vh;width:260px;left:0;top:0;}
  </style>
</head>
<body>
<button class="mobile-hamburger" onclick="document.querySelector('.sidebar').classList.toggle('mobile-open');document.querySelector('.sidebar-overlay').classList.toggle('active');" aria-label="Menu">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('mobile-open');this.classList.remove('active');"></div>

<div class="sidebar">
  <div class="logo"><svg viewBox="0 0 56 56" width="26" height="26"><polygon points="28,4 50,16 50,40 28,52 6,40 6,16" fill="none" stroke="#3DDB82" stroke-width="1.5"/><circle cx="28" cy="20" r="3" fill="#3DDB82"/><circle cx="18" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/><circle cx="38" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/><line x1="28" y1="23" x2="18" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/><line x1="28" y1="23" x2="38" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/></svg><div><div class="name">Almeida <span>Inteligencia</span></div><div class="tag">Agendamento</div></div></div>
  <a href="/agendamento-painel/" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Dashboard</a>
  <a href="/agendamento-painel/config.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83"/></svg>Configuracoes</a>
  <a href="/agendamento-painel/servicos.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Servicos</a>
  <a href="/agendamento-painel/horarios.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Horarios</a>
  <a href="/agendamento-painel/clientes.html" class="nav-item active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes</a>
  <a href="/dashboard/" class="nav-item" id="portal-link" style="display:none"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Portal</a>
  <div class="sidebar-spacer"></div>
  <div class="user-chip"><div>Conta</div><div class="email" id="user-email">—</div></div>
  <button class="logout-btn" onclick="logout()">Sair</button>
</div>

<div class="main">
  <div class="page-header">
    <h1>Clientes</h1>
    <p>Clientes cadastrados automaticamente via WhatsApp</p>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Nome</th><th>Telefone</th><th>Cadastrado em</th></tr></thead>
      <tbody id="tabela-body"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none">Nenhum cliente cadastrado ainda.</div>
  </div>
</div>

<div class="modal-backdrop" id="modal" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <h3 id="detail-nome">—</h3>
    <div class="sub" id="detail-telefone">—</div>
    <div class="detail-row"><span class="label">Cadastrado em</span><span class="value" id="detail-criado">—</span></div>
    <div class="hist-title">Historico de Agendamentos</div>
    <div id="detail-hist"></div>
    <button class="btn-close" onclick="fecharModal()">Fechar</button>
  </div>
</div>

<script>
const API = '/central/agendamento';
const TOKEN = localStorage.getItem('central_token');
const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

document.getElementById('user-email').textContent = localStorage.getItem('central_email') || '—';
if (localStorage.getItem('admin_token')) document.getElementById('portal-link').style.display = '';

async function carregar() {
  try {
    const res = await fetch(`${API}/clients`, { headers: HEADERS });
    if (!res.ok) { document.getElementById('empty-msg').style.display = ''; return; }
    const clients = await res.json();
    render(clients);
  } catch(e) { console.error(e); }
}

function render(clients) {
  const body = document.getElementById('tabela-body');
  const empty = document.getElementById('empty-msg');
  if (!clients.length) { body.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';
  body.innerHTML = clients.map(c => {
    const dt = c.criado_em ? new Date(c.criado_em).toLocaleDateString('pt-BR') : '—';
    return `<tr class="clickable" onclick="verDetalhe(${c.id})">
      <td style="font-weight:500">${c.nome || '—'}</td>
      <td>${c.telefone}</td>
      <td style="color:var(--gray-l)">${dt}</td>
    </tr>`;
  }).join('');
}

async function verDetalhe(id) {
  try {
    const res = await fetch(`${API}/clients/${id}`, { headers: HEADERS });
    if (!res.ok) return;
    const data = await res.json();

    document.getElementById('detail-nome').textContent = data.nome || 'Sem nome';
    document.getElementById('detail-telefone').textContent = data.telefone;
    document.getElementById('detail-criado').textContent = data.criado_em ? new Date(data.criado_em).toLocaleDateString('pt-BR') : '—';

    const hist = data.agendamentos || [];
    document.getElementById('detail-hist').innerHTML = hist.length
      ? hist.map(a => {
          const dt = new Date(a.data_hora);
          return `<div class="hist-item">
            <span class="dt">${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>
            <span class="badge ${a.status}">${a.status.replace('_',' ')}</span>
          </div>`;
        }).join('')
      : '<div style="color:var(--gray);font-size:12px;padding:8px 0;">Nenhum agendamento registrado.</div>';

    document.getElementById('modal').classList.add('show');
  } catch(e) { console.error(e); }
}

function fecharModal() { document.getElementById('modal').classList.remove('show'); }

function logout() { localStorage.removeItem('central_token'); localStorage.removeItem('central_email'); window.location.href = '/dashboard/'; }

carregar();
</script>
</body>
</html>
