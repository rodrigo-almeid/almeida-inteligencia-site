<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento — Horarios</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#3DDB82;--black:#0A0F0A;--bg2:#1A241C;--bg3:#0E1810;--gray:#5C6B5E;--gray-l:#A8B8AA;--red:#E24B4A;--yellow:#F5A623;--border:rgba(61,219,130,0.12);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--black);color:#fff;min-height:100vh;display:flex;}
    .sidebar{width:220px;height:100vh;position:sticky;top:0;background:var(--bg3);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;overflow-y:auto;}
    .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
    .sidebar .logo .name{font-size:13px;font-weight:600;} .sidebar .logo .name span{color:var(--green);}
    .sidebar .tag{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.1em;margin-top:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;color:var(--gray-l);cursor:pointer;transition:all .2s;margin-bottom:4px;text-decoration:none;}
    .nav-item:hover,.nav-item.active{background:rgba(61,219,130,.08);color:var(--green);}
    .sidebar-spacer{flex:1;}
    .user-chip{background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--gray-l);}
    .user-chip .email{font-size:11px;color:var(--gray);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .logout-btn{margin-top:8px;width:100%;background:none;border:0.5px solid rgba(226,75,74,.3);border-radius:10px;padding:9px;color:var(--red);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;}
    .logout-btn:hover{background:rgba(226,75,74,.08);}
    .main{flex:1;padding:32px;overflow-y:auto;max-width:800px;}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
    .page-header h1{font-size:22px;font-weight:600;}
    .page-header p{font-size:13px;color:var(--gray);margin-top:4px;}

    .grid-semana{display:flex;flex-direction:column;gap:10px;}
    .dia-row{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .dia-nome{font-size:14px;font-weight:600;min-width:100px;}
    .dia-campos{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .dia-campos input{background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 12px;font-size:13px;color:#fff;font-family:'Inter',sans-serif;outline:none;width:90px;text-align:center;transition:border-color .2s;}
    .dia-campos input:focus{border-color:rgba(61,219,130,.4);}
    .dia-campos span{color:var(--gray);font-size:13px;}
    .toggle{position:relative;width:44px;height:24px;cursor:pointer;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle .slider{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:12px;transition:.3s;}
    .toggle .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
    .toggle input:checked+.slider{background:var(--green);}
    .toggle input:checked+.slider:before{transform:translateX(20px);}

    .btn-save{background:var(--green);color:var(--black);border:none;border-radius:10px;padding:12px 32px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;margin-top:20px;}
    .btn-save:hover{opacity:.85;}

    .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all .3s;}
    .toast.show{opacity:1;transform:translateY(0);}.toast.ok{border-color:rgba(61,219,130,.4);color:var(--green);}.toast.err{border-color:rgba(226,75,74,.4);color:var(--red);}
    @media(max-width:640px){.sidebar{display:none;}.main{padding:16px;}.dia-row{flex-direction:column;align-items:flex-start;}}
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><svg viewBox="0 0 56 56" width="26" height="26"><polygon points="28,4 50,16 50,40 28,52 6,40 6,16" fill="none" stroke="#3DDB82" stroke-width="1.5"/><circle cx="28" cy="20" r="3" fill="#3DDB82"/><circle cx="18" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/><circle cx="38" cy="30" r="2.5" fill="#3DDB82" opacity=".7"/><line x1="28" y1="23" x2="18" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/><line x1="28" y1="23" x2="38" y2="28" stroke="#3DDB82" stroke-width=".8" opacity=".6"/></svg><div><div class="name">Almeida <span>Inteligencia</span></div><div class="tag">Agendamento</div></div></div>
  <a href="/agendamento-painel/" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Dashboard</a>
  <a href="/agendamento-painel/config.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83"/></svg>Configuracoes</a>
  <a href="/agendamento-painel/servicos.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Servicos</a>
  <a href="/agendamento-painel/horarios.html" class="nav-item active"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Horarios</a>
  <a href="/agendamento-painel/clientes.html" class="nav-item"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Clientes</a>
  <a href="/dashboard/" class="nav-item" id="portal-link" style="display:none"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Portal</a>
  <div class="sidebar-spacer"></div>
  <div class="user-chip"><div>Conta</div><div class="email" id="user-email">—</div></div>
  <button class="logout-btn" onclick="logout()">Sair</button>
</div>

<div class="main">
  <div class="page-header">
    <div><h1>Horarios de Funcionamento</h1><p>Defina os horarios de atendimento para cada dia da semana</p></div>
  </div>

  <div class="grid-semana" id="grid-semana"></div>
  <button class="btn-save" onclick="salvar()">Salvar Horarios</button>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/central/agendamento';
const TOKEN = localStorage.getItem('central_token');
const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
const DIAS = ['Segunda-feira','Terca-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sabado','Domingo'];

document.getElementById('user-email').textContent = localStorage.getItem('central_email') || '—';
if (localStorage.getItem('admin_token')) document.getElementById('portal-link').style.display = '';

function renderGrid(horarios) {
  const grid = document.getElementById('grid-semana');
  grid.innerHTML = DIAS.map((nome, i) => {
    const h = horarios.find(x => x.dia_semana === i);
    const ativo = h ? h.ativo : (i < 6);
    const inicio = h ? h.hora_inicio : '09:00';
    const fim = h ? h.hora_fim : '18:00';
    return `<div class="dia-row">
      <div class="dia-nome">${nome}</div>
      <div class="dia-campos">
        <input type="time" id="inicio-${i}" value="${inicio}">
        <span>ate</span>
        <input type="time" id="fim-${i}" value="${fim}">
      </div>
      <label class="toggle">
        <input type="checkbox" id="ativo-${i}" ${ativo ? 'checked' : ''}>
        <span class="slider"></span>
      </label>
    </div>`;
  }).join('');
}

async function carregar() {
  try {
    const res = await fetch(`${API}/horarios`, { headers: HEADERS });
    if (res.ok) { renderGrid(await res.json()); }
    else { renderGrid([]); }
  } catch(e) { renderGrid([]); }
}

async function salvar() {
  const horarios = DIAS.map((_, i) => ({
    dia_semana: i,
    hora_inicio: document.getElementById(`inicio-${i}`).value,
    hora_fim: document.getElementById(`fim-${i}`).value,
    ativo: document.getElementById(`ativo-${i}`).checked,
  }));

  try {
    const res = await fetch(`${API}/horarios`, {
      method: 'POST', headers: HEADERS, body: JSON.stringify(horarios),
    });
    if (res.ok) { toast('Horarios salvos!', 'ok'); carregar(); }
    else { const e = await res.json(); toast(e.detail || 'Erro', 'err'); }
  } catch(e) { toast('Erro de conexao', 'err'); }
}

function toast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast show ${tipo}`;
  setTimeout(() => t.className = 'toast', 3000);
}

function logout() { localStorage.removeItem('central_token'); localStorage.removeItem('central_email'); window.location.href = '/dashboard/'; }

carregar();
</script>
</body>
</html>
