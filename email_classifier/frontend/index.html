<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Manager — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-6">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl mb-4">
        <i class="fa-solid fa-envelope-open-text text-2xl"></i>
      </div>
      <h1 class="text-2xl font-semibold">Email Manager</h1>
      <p class="text-gray-400 text-sm mt-1">Classificação inteligente de e-mails</p>
    </div>

    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-6">
      <div class="space-y-4">
        <div>
          <label class="text-xs text-gray-400 block mb-1">E-mail</label>
          <input id="inp-email" type="email" placeholder="seu@email.com" autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Senha</label>
          <input id="inp-senha" type="password" placeholder="••••••••"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div id="erro" class="hidden text-red-400 text-xs pt-1"></div>
        <button onclick="login()" id="btn-login"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg font-medium text-sm transition mt-2">
          Entrar
        </button>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('email_token')) window.location.href = '/email/dashboard.html';

    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    async function login() {
      const email = document.getElementById('inp-email').value.trim();
      const senha = document.getElementById('inp-senha').value;
      const erroEl = document.getElementById('erro');
      const btn = document.getElementById('btn-login');
      erroEl.classList.add('hidden');

      if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; erroEl.classList.remove('hidden'); return; }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Entrando…';

      try {
        const form = new URLSearchParams();
        form.append('username', email);
        form.append('password', senha);

        const res = await fetch('/email/auth/login', { method: 'POST', body: form });
        const data = await res.json();

        if (!res.ok) { erroEl.textContent = data.detail || 'Credenciais inválidas.'; erroEl.classList.remove('hidden'); return; }

        localStorage.setItem('email_token', data.access_token);
        localStorage.setItem('email_nome', data.nome);
        window.location.href = '/email/dashboard.html';
      } catch (_) {
        erroEl.textContent = 'Erro de conexão.'; erroEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Entrar';
      }
    }
  </script>
</body>
</html>
